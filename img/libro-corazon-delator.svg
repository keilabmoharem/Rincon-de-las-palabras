<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="heartBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F0E0E"/>
      <stop offset="50%" stop-color="#140A0A"/>
      <stop offset="100%" stop-color="#090505"/>
    </linearGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#BD2626" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6B1313" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#140A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bloodGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2B755"/>
      <stop offset="50%" stop-color="#FFDE99"/>
      <stop offset="100%" stop-color="#A82828"/>
    </linearGradient>
  </defs>

  <!-- Fondo oscuro y claustrofóbico -->
  <rect width="400" height="600" fill="url(#heartBg)"/>

  <!-- Sombra de lomo -->
  <rect x="0" y="0" width="18" height="600" fill="#000000" opacity="0.5"/>
  <line x1="18" y1="0" x2="18" y2="600" stroke="#8E2424" stroke-width="0.75" opacity="0.4"/>

  <!-- Marco gótico de crimen psicológico -->
  <rect x="25" y="25" width="350" height="550" fill="none" stroke="#A82828" stroke-width="1.2" opacity="0.7"/>
  <rect x="31" y="31" width="338" height="538" fill="none" stroke="#C59B42" stroke-width="0.75" stroke-dasharray="8,4" opacity="0.5"/>

  <!-- Resplandor del latido bajo el suelo -->
  <circle cx="200" cy="225" r="95" fill="url(#pulseGlow)"/>

  <!-- Silueta del corazón anatómico latiendo en la oscuridad -->
  <g transform="translate(200, 220) scale(0.95)">
    <!-- Silueta corazón estilizada -->
    <path d="M0,45 C-45,15 -60,-25 -40,-50 C-20,-75 0,-45 0,-30 C0,-45 20,-75 40,-50 C60,-25 45,15 0,45 Z" fill="#8B1A1A" stroke="#C59B42" stroke-width="1.8"/>
    <path d="M0,35 C-32,10 -45,-20 -30,-40 C-15,-58 0,-35 0,-25 C0,-35 15,-58 30,-40 C45,-20 32,10 0,35 Z" fill="#5E0F0F"/>
    
    <!-- Arterias y venas pulsantes -->
    <path d="M-8,-32 C-15,-55 -30,-65 -25,-85" fill="none" stroke="#A82828" stroke-width="3" stroke-linecap="round"/>
    <path d="M5,-32 C12,-55 25,-65 20,-85" fill="none" stroke="#C59B42" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Haz de luz estrecho de linterna sorda (el ojo de buitre) -->
    <polygon points="0,-130 -85,120 85,120" fill="#FFF2BD" opacity="0.12"/>
    <circle cx="0" cy="-130" r="8" fill="#FFF2BD" opacity="0.6"/>

    <!-- Ondas concéntricas de sonido del latido ("¡Pum... Pum... Pum!") -->
    <circle cx="0" cy="5" r="55" fill="none" stroke="#BD2626" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.6"/>
    <circle cx="0" cy="5" r="75" fill="none" stroke="#BD2626" stroke-width="0.8" stroke-dasharray="6,6" opacity="0.4"/>
  </g>

  <!-- Tablones de madera del suelo donde se oculta el secreto -->
  <line x1="60" y1="330" x2="340" y2="330" stroke="#3D1D16" stroke-width="3"/>
  <line x1="60" y1="350" x2="340" y2="350" stroke="#2B140F" stroke-width="2.5"/>
  <!-- Clavos de época en los tablones -->
  <circle cx="80" cy="330" r="2.5" fill="#C59B42"/>
  <circle cx="200" cy="330" r="2.5" fill="#BD2626"/>
  <circle cx="320" cy="330" r="2.5" fill="#C59B42"/>

  <!-- Encabezado y Título -->
  <text x="200" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="4" fill="#A82828">THRILLER PSICOLÓGICO</text>
  <line x1="130" y1="86" x2="270" y2="86" stroke="#C59B42" stroke-width="1"/>

  <text x="200" y="390" text-anchor="middle" font-family="'Lora', Georgia, serif" font-size="13" font-weight="600" letter-spacing="3" fill="#D9A8A8">EL ETERNO LATIDO DE</text>
  <text x="200" y="420" text-anchor="middle" font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" letter-spacing="2" fill="url(#bloodGold)">EL CORAZÓN</text>
  <text x="200" y="450" text-anchor="middle" font-family="'Lora', Georgia, serif" font-size="22" font-weight="700" letter-spacing="2" fill="url(#bloodGold)">DELATOR</text>

  <text x="200" y="478" text-anchor="middle" font-family="'Lora', Georgia, serif" font-style="italic" font-size="11" fill="#C2A992">«¿No lo oyen?... ¡Es el latido de su espantoso corazón!»</text>

  <!-- Autor -->
  <text x="200" y="525" text-anchor="middle" font-family="'Lora', Georgia, serif" font-size="14" font-weight="700" letter-spacing="2" fill="#F0E2D5">EDGAR ALLAN POE</text>
  <text x="200" y="545" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" letter-spacing="3" fill="#A82828">CLÁSICOS DEL HORROR &amp; CULPA</text>
</svg>
