<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="teaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6EFE3"/>
      <stop offset="50%" stop-color="#ECE1CF"/>
      <stop offset="100%" stop-color="#DFD2BD"/>
    </linearGradient>
    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F836A"/>
      <stop offset="50%" stop-color="#4F644A"/>
      <stop offset="100%" stop-color="#344530"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#teaBg)"/>

  <!-- Spine Shadow -->
  <rect x="0" y="0" width="18" height="600" fill="#241B12" opacity="0.15"/>
  <line x1="18" y1="0" x2="18" y2="600" stroke="#7A6855" stroke-width="0.75" opacity="0.3"/>

  <!-- Geometric Japanese Minimalist Circle Motif -->
  <circle cx="200" cy="315" r="115" fill="#E8D9C4" opacity="0.7"/>
  <circle cx="200" cy="315" r="105" fill="none" stroke="#CBB9A2" stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- Steam Whisps -->
  <path d="M185,255 C180,230 195,210 188,185 C182,165 190,145 185,130" fill="none" stroke="#D1C3B2" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M210,250 C215,225 200,205 208,180 C214,160 205,140 212,125" fill="none" stroke="#D1C3B2" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Ceramic Teacup (Chawan) -->
  <g transform="translate(200, 345) scale(1)">
    <!-- Wooden Coaster -->
    <ellipse cx="0" cy="35" rx="72" ry="14" fill="#9C6B4E"/>
    <ellipse cx="0" cy="32" rx="70" ry="12" fill="#BA8767"/>

    <!-- Cup Body -->
    <path d="M-55,-15 C-52,25 -35,32 0,32 C35,32 52,25 55,-15 Z" fill="url(#ceramicGrad)"/>
    
    <!-- Cup Rim & Liquid -->
    <ellipse cx="0" cy="-15" rx="55" ry="15" fill="#43563F"/>
    <ellipse cx="0" cy="-15" rx="51" ry="13" fill="#D99B43" opacity="0.9"/>
    <ellipse cx="0" cy="-15" rx="46" ry="11" fill="#C9862E"/>

    <!-- Floating Jasmine Petal -->
    <ellipse cx="-10" cy="-15" rx="5" ry="2.5" transform="rotate(-20 -10 -15)" fill="#FDFBF7" opacity="0.9"/>
  </g>

  <!-- Delicate Cherry Blossom Twig -->
  <g transform="translate(100, 210) scale(0.65)" stroke="#6E5647" stroke-linecap="round">
    <path d="M-80,-20 Q-20,10 30,-5 T90,20" fill="none" stroke-width="2.5"/>
    <!-- Blossoms -->
    <circle cx="0" cy="5" r="7" fill="#E8968F" stroke="none"/>
    <circle cx="0" cy="5" r="3" fill="#FFE2DF" stroke="none"/>
    <circle cx="50" cy="1" r="6" fill="#E8968F" stroke="none"/>
    <circle cx="50" cy="1" r="2.5" fill="#FFE2DF" stroke="none"/>
    <circle cx="-50" cy="-7" r="6" fill="#E8968F" stroke="none"/>
  </g>

  <!-- Title & Poetry Frame -->
  <text x="200" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#6B5B49">RELATOS DEL ATELIER</text>
  
  <text x="200" y="112" text-anchor="middle" font-family="'Lora', serif" font-size="24" font-weight="700" fill="#241B12">HISTORIAS DE UNA</text>
  <text x="200" y="140" text-anchor="middle" font-family="'Lora', serif" font-size="24" font-weight="700" fill="#241B12">TAZA DE TÉ</text>
  
  <text x="200" y="165" text-anchor="middle" font-family="'Lora', serif" font-style="italic" font-size="12" fill="#5E7758">Pausas, aromas y memoria</text>

  <!-- Author Tag at Bottom -->
  <text x="200" y="525" text-anchor="middle" font-family="'Lora', serif" font-size="15" font-weight="600" letter-spacing="2" fill="#241B12">HARUKI TANAKA</text>
  <text x="200" y="545" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" letter-spacing="2" fill="#7A6855">TRADUCCIÓN DE MARÍA SOLER</text>
</svg>
