<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1313"/>
      <stop offset="50%" stop-color="#2D1717"/>
      <stop offset="100%" stop-color="#0E0808"/>
    </linearGradient>
    <radialGradient id="moonGlow1" cx="50%" cy="28%" r="35%">
      <stop offset="0%" stop-color="#FFEBB8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#E4C180" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2D1717" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8C37D"/>
      <stop offset="50%" stop-color="#FDF2D0"/>
      <stop offset="100%" stop-color="#C59B42"/>
    </linearGradient>
  </defs>

  <!-- Fondo gótico misterio -->
  <rect width="400" height="600" fill="url(#bgGrad1)"/>

  <!-- Sombra de lomo de libro antiguo -->
  <rect x="0" y="0" width="18" height="600" fill="#000000" opacity="0.45"/>
  <line x1="18" y1="0" x2="18" y2="600" stroke="#C59B42" stroke-width="0.75" opacity="0.4"/>

  <!-- Marco victoriano dorado -->
  <rect x="25" y="25" width="350" height="550" fill="none" stroke="#C59B42" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.7"/>
  <rect x="31" y="31" width="338" height="538" fill="none" stroke="#8E2424" stroke-width="0.75" opacity="0.6"/>

  <!-- Resplandor de luna detrás de la mansión -->
  <circle cx="200" cy="245" r="95" fill="url(#moonGlow1)"/>
  <circle cx="200" cy="245" r="42" fill="#F4E2BB" opacity="0.85"/>

  <!-- Relámpago victoriano en la tormenta -->
  <path d="M140,80 L165,150 L155,160 L185,220" fill="none" stroke="#FFE9A3" stroke-width="1.8" opacity="0.6" stroke-linecap="round"/>

  <!-- Silueta de la Mansión Blackwood -->
  <path d="M90,340 L90,260 L115,225 L140,260 L150,260 L150,210 L170,180 L190,210 L210,210 L230,170 L250,210 L250,260 L275,230 L300,260 L310,260 L310,340 Z" fill="#0D0707"/>
  <!-- Aguja gótica y torres -->
  <polygon points="170,180 166,135 174,135" fill="#0D0707"/>
  <polygon points="230,170 227,120 233,120" fill="#0D0707"/>
  
  <!-- Ventanas iluminadas con luz de vela tenue -->
  <rect x="163" y="235" width="14" height="22" rx="4" fill="#FCE38A" opacity="0.85"/>
  <line x1="170" y1="235" x2="170" y2="257" stroke="#0D0707" stroke-width="1.2"/>
  <line x1="163" y1="246" x2="177" y2="246" stroke="#0D0707" stroke-width="1.2"/>

  <!-- Colina y verja de hierro forjado -->
  <path d="M25,335 Q200,315 375,340 L375,360 L25,360 Z" fill="#080404"/>
  <path d="M40,340 L40,320 M60,338 L60,316 M80,336 L80,318 M100,334 L100,316 M120,333 L120,318 M280,333 L280,318 M300,334 L300,316 M320,336 L320,318 M340,338 L340,320 M360,340 L360,320" stroke="#2D1E16" stroke-width="1.5"/>

  <!-- Niebla baja -->
  <ellipse cx="200" cy="350" rx="160" ry="14" fill="#E8C37D" opacity="0.12"/>

  <!-- Tipografía del Título Estilo Agatha Christie -->
  <text x="200" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="4" fill="#C59B42">CASO DE CUARTO CERRADO</text>
  <line x1="140" y1="86" x2="260" y2="86" stroke="#8E2424" stroke-width="1"/>

  <text x="200" y="395" text-anchor="middle" font-family="'Lora', Georgia, serif" font-size="15" font-weight="600" letter-spacing="3" fill="#D98A8A">EL ENIGMA DE</text>
  <text x="200" y="430" text-anchor="middle" font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" letter-spacing="2" fill="url(#goldText)">MANSIÓN</text>
  <text x="200" y="462" text-anchor="middle" font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" letter-spacing="2" fill="url(#goldText)">BLACKWOOD</text>

  <text x="200" y="492" text-anchor="middle" font-family="'Lora', Georgia, serif" font-style="italic" font-size="11" fill="#C2A992">Siete sospechosos. Ninguna salida.</text>

  <!-- Autor -->
  <text x="200" y="535" text-anchor="middle" font-family="'Lora', Georgia, serif" font-size="13" font-weight="600" letter-spacing="2" fill="#F0E0CA">EVELYN H. VANCE</text>
  <text x="200" y="552" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" letter-spacing="3" fill="#8E2424">ARCHIVOS DE SCOTLAND YARD</text>
</svg>
