<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8EE"/>
      <stop offset="50%" stop-color="#F3ECE0"/>
      <stop offset="100%" stop-color="#E8DEC9"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B7055"/>
      <stop offset="100%" stop-color="#3C4D38"/>
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Book Background -->
  <rect width="400" height="600" fill="url(#parchment)"/>
  
  <!-- Subtle Spine Shadow -->
  <rect x="0" y="0" width="18" height="600" fill="#2E2419" opacity="0.12"/>
  <line x1="18" y1="0" x2="18" y2="600" stroke="#7A6855" stroke-width="0.8" opacity="0.4"/>

  <!-- Ornate Botanical Border -->
  <rect x="28" y="28" width="344" height="544" fill="none" stroke="#5B7055" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>
  <rect x="34" y="34" width="332" height="532" fill="none" stroke="#7A6855" stroke-width="0.75" opacity="0.5"/>

  <!-- Corner Ornaments -->
  <circle cx="34" cy="34" r="3" fill="#5B7055"/>
  <circle cx="366" cy="34" r="3" fill="#5B7055"/>
  <circle cx="34" cy="566" r="3" fill="#5B7055"/>
  <circle cx="366" cy="566" r="3" fill="#5B7055"/>

  <!-- Botanical Herbarium Illustration -->
  <g transform="translate(200, 290) scale(0.95)" filter="url(#subtleShadow)">
    <!-- Central Stem -->
    <path d="M0,110 C5,50 -10,-10 0,-90" fill="none" stroke="#485B43" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Leaves Left -->
    <path d="M-2,60 C-35,45 -55,20 -40,0 C-25,-20 0,20 -2,60" fill="url(#leafGrad)" opacity="0.9"/>
    <path d="M-4,10 C-45,-5 -60,-35 -45,-50 C-30,-60 -5,-20 -4,10" fill="url(#leafGrad)" opacity="0.85"/>
    <path d="M-3,-40 C-35,-55 -45,-80 -30,-90 C-18,-95 0,-65 -3,-40" fill="url(#leafGrad)" opacity="0.8"/>

    <!-- Leaves Right -->
    <path d="M2,80 C35,65 55,40 40,20 C25,0 0,40 2,80" fill="url(#leafGrad)" opacity="0.9"/>
    <path d="M3,30 C45,15 65,-15 50,-30 C35,-45 5,-5 3,30" fill="url(#leafGrad)" opacity="0.85"/>
    <path d="M1,-20 C35,-35 48,-60 35,-70 C22,-78 0,-45 1,-20" fill="url(#leafGrad)" opacity="0.8"/>

    <!-- Flower Bud at Top -->
    <ellipse cx="0" cy="-96" rx="9" ry="14" fill="#C35A38" opacity="0.9"/>
    <ellipse cx="-6" cy="-93" rx="7" ry="11" fill="#D97A53" opacity="0.85"/>
    <ellipse cx="6" cy="-93" rx="7" ry="11" fill="#D97A53" opacity="0.85"/>
    <circle cx="0" cy="-102" r="3.5" fill="#E8A87C"/>
    
    <!-- Delicate Pressed Petals Falling -->
    <ellipse cx="-55" cy="85" rx="5" ry="9" transform="rotate(-30 -55 85)" fill="#C35A38" opacity="0.6"/>
    <ellipse cx="60" cy="95" rx="4" ry="7" transform="rotate(40 60 95)" fill="#D97A53" opacity="0.5"/>
  </g>

  <!-- Collection Badge -->
  <text x="200" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#7A6855">CUADERNOS NATURALISTAS</text>
  <line x1="160" y1="92" x2="240" y2="92" stroke="#7A6855" stroke-width="0.8" opacity="0.5"/>

  <!-- Title & Author -->
  <text x="200" y="145" text-anchor="middle" font-family="'Lora', serif" font-size="28" font-weight="700" fill="#2E2419">BOTÁNICA PARA</text>
  <text x="200" y="180" text-anchor="middle" font-family="'Lora', serif" font-size="28" font-weight="700" fill="#2E2419">SOÑADORES</text>
  
  <text x="200" y="212" text-anchor="middle" font-family="'Lora', serif" font-style="italic" font-size="14" fill="#5B7055">Guía lírica de hierbas, raíces y bosques</text>

  <!-- Author Name -->
  <text x="200" y="525" text-anchor="middle" font-family="'Lora', serif" font-size="15" font-weight="600" letter-spacing="2" fill="#2E2419">ELENA VALENZUELA</text>
  <text x="200" y="542" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" letter-spacing="2" fill="#7A6855">EDICIÓN ILUSTRADA</text>
</svg>
